<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory SPA — Kameshwar S</title>
  
  <!-- Subtle, Clean Sans-Serif Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --accent-border: #bfdbfe;
      
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 92%;
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Subdued Professional Header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 0;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 0.1rem;
    }

    .system-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0.35rem 0.8rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.75rem;
      margin-top: 2rem;
      margin-bottom: 3.5rem;
    }

    @media (max-width: 880px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Clean Card Container */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      margin-bottom: 1.25rem;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .panel-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    /* Minimal Form Controls */
    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      font-size: 0.88rem;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* List Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .badge-count {
      display: inline-block;
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      margin-left: 0.4rem;
    }

    .search-input {
      width: 220px;
      padding: 0.5rem 0.75rem;
      font-size: 0.82rem;
    }

    /* Subdued Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.1rem;
    }

    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .contact-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .avatar-clean {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .card-meta h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .role-text {
      font-size: 0.76rem;
      color: var(--text-secondary);
      display: block;
      margin-top: 0.1rem;
    }

    .card-details {
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .card-details p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      word-break: break-all;
    }

    .card-details p:last-child {
      margin-bottom: 0;
    }

    .card-details strong {
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.78rem;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
    }

    .btn-remove {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-remove:hover {
      background: var(--danger-light);
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Clean Enterprise Header -->
  <header class="app-header">
    <div class="container header-content">
      <div>
        <h1 class="brand-title">Directory Management</h1>
        <p class="brand-sub">Lead Developer: Kameshwar S</p>
      </div>
      <div class="system-status">
        <span class="status-dot"></span> System Ready
      </div>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="container main-grid">
    
    <!-- User Input Panel -->
    <aside class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Add Directory Entry</h2>
        <p class="panel-desc">Register a new team member or department contact.</p>
      </div>

      <form id="contactForm">
        <div class="form-group">
          <label for="contactName">Full Name</label>
          <input type="text" id="contactName" placeholder="e.g. Eleanor Vance" required />
        </div>

        <div class="form-group">
          <label for="contactEmail">Email Address</label>
          <input type="email" id="contactEmail" placeholder="e.g. eleanor@company.com" required />
        </div>

        <div class="form-group">
          <label for="contactPhone">Phone Number</label>
          <input type="tel" id="contactPhone" placeholder="e.g. +91 98765 43210" required />
        </div>

        <div class="form-group">
          <label for="contactRole">Department / Position</label>
          <select id="contactRole">
            <option value="Lead Software Engineer">Lead Software Engineer</option>
            <option value="Frontend Developer">Frontend Developer</option>
            <option value="Backend Developer">Backend Developer</option>
            <option value="Product Designer">Product Designer</option>
            <option value="Technical Project Manager">Technical Project Manager</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">
          Save Contact
        </button>
      </form>
    </aside>

    <!-- Contacts Directory Grid -->
    <section class="panel">
      <div class="toolbar">
        <div>
          <span class="panel-title">Team Members</span>
          <span id="contactCountBadge" class="badge-count">0</span>
        </div>
        <input type="text" id="searchInput" placeholder="Search directory..." class="search-input" />
      </div>

      <div id="userListContainer" class="cards-grid">
        <!-- Dynamically injected cards -->
      </div>

      <div id="emptyState" class="empty-state hidden">
        No contacts match the current query.
      </div>
    </section>

  </main>

  <script>
    // Initial pre-loaded profiles
    let contacts = [
      {
        id: "c-01",
        name: "Kameshwar S",
        email: "kameshwar.s@company.com",
        phone: "+91 98765 43210",
        role: "Lead Software Engineer"
      },
      {
        id: "c-02",
        name: "Claire Bennett",
        email: "claire.b@company.com",
        phone: "+1 415-555-0142",
        role: "Product Designer"
      }
    ];

    const contactForm = document.getElementById("contactForm");
    const contactName = document.getElementById("contactName");
    const contactEmail = document.getElementById("contactEmail");
    const contactPhone = document.getElementById("contactPhone");
    const contactRole = document.getElementById("contactRole");
    const userListContainer = document.getElementById("userListContainer");
    const contactCountBadge = document.getElementById("contactCountBadge");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");

    function renderList(query = "") {
      userListContainer.innerHTML = "";

      const filtered = contacts.filter((c) =>
        c.name.toLowerCase().includes(query.toLowerCase()) ||
        c.email.toLowerCase().includes(query.toLowerCase()) ||
        c.role.toLowerCase().includes(query.toLowerCase())
      );

      contactCountBadge.textContent = `${filtered.length}`;

      if (filtered.length === 0) {
        emptyState.classList.remove("hidden");
        return;
      }
      emptyState.classList.add("hidden");

      filtered.forEach((item) => {
        const card = document.createElement("article");
        card.className = "contact-card";

        const initials = item.name
          .trim()
          .split(" ")
          .map(n => n[0])
          .join("")
          .slice(0, 2)
          .toUpperCase() || "—";

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="avatar-clean">${initials}</div>
              <div class="card-meta">
                <h3>${escapeHTML(item.name)}</h3>
                <span class="role-text">${escapeHTML(item.role)}</span>
              </div>
            </div>

            <div class="card-details">
              <p><strong>Email:</strong> ${escapeHTML(item.email)}</p>
              <p><strong>Phone:</strong> ${escapeHTML(item.phone)}</p>
            </div>
          </div>

          <div class="card-footer">
            <button class="btn-remove" onclick="removeContact('${item.id}')">Remove</button>
          </div>
        `;

        userListContainer.appendChild(card);
      });
    }

    contactForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const newEntry = {
        id: "c-" + Date.now(),
        name: contactName.value.trim(),
        email: contactEmail.value.trim(),
        phone: contactPhone.value.trim(),
        role: contactRole.value
      };

      contacts.unshift(newEntry);
      contactForm.reset();
      renderList(searchInput.value);
    });

    window.removeContact = function(id) {
      contacts = contacts.filter((c) => c.id !== id);
      renderList(searchInput.value);
    };

    searchInput.addEventListener("input", (e) => {
      renderList(e.target.value);
    });

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    renderList();
  </script>
</body>
</html>
