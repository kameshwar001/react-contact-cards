<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER_OPS // Operative Registry - Kameshwar S</title>
  
  <!-- Monospace Cyberpunk Terminal Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #04080e;
      --panel-bg: rgba(7, 14, 24, 0.85);
      --panel-border: #00ff7333;
      --panel-border-bright: #00ff73aa;
      --neon-green: #00ff73;
      --neon-cyan: #00e5ff;
      --neon-red: #ff0055;
      --neon-amber: #ffb700;
      --text-main: #d1fae5;
      --text-dim: #52796f;
      --terminal-font: 'Fira Code', monospace;
      --display-font: 'Orbitron', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--terminal-font);
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at 50% -10%, #00ff731a 0%, transparent 60%),
        radial-gradient(ellipse at 90% 90%, #00e5ff10 0%, transparent 50%),
        linear-gradient(rgba(0, 255, 115, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 115, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 3rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Screen Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 3px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.7;
    }

    .container {
      width: 92%;
      max-width: 1250px;
      margin: 0 auto;
    }

    /* Top Command Header */
    .app-header {
      background: rgba(4, 9, 16, 0.95);
      border-bottom: 1px solid var(--panel-border-bright);
      box-shadow: 0 4px 30px rgba(0, 255, 115, 0.1);
      padding: 1.2rem 0;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-title {
      font-family: var(--display-font);
      font-size: 1.45rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.12em;
      text-shadow: 0 0 12px var(--neon-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title span {
      color: var(--neon-green);
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .sys-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.4rem 0.9rem;
      background: rgba(0, 255, 115, 0.08);
      border: 1px solid var(--neon-green);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-green);
      letter-spacing: 0.05em;
    }

    .blinking-dot {
      width: 7px;
      height: 7px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-green);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Main Grid Layout */
    .main-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      margin-top: 2.2rem;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Cyber Glass Cards */
    .cyber-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.6rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Corner Target Reticles */
    .cyber-panel::before,
    .cyber-panel::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }

    .cyber-panel::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--neon-green);
      border-left: 2px solid var(--neon-green);
    }

    .cyber-panel::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--neon-green);
      border-right: 2px solid var(--neon-green);
    }

    .panel-heading {
      font-family: var(--display-font);
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 1.4rem;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px dashed var(--panel-border);
      padding-bottom: 0.8rem;
    }

    .panel-heading span {
      color: var(--neon-green);
    }

    /* Cyber Form Controls */
    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.45rem;
    }

    label::before {
      content: ">> ";
      color: var(--neon-green);
    }

    input, select {
      width: 100%;
      background: rgba(2, 6, 12, 0.9);
      border: 1px solid #133327;
      border-radius: 4px;
      padding: 0.75rem 0.9rem;
      color: var(--neon-green);
      font-size: 0.88rem;
      transition: all 0.25s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 115, 0.25);
      background: #02070f;
    }

    select option {
      background: #060c16;
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 255, 115, 0.15) 0%, rgba(0, 229, 255, 0.1) 100%);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      padding: 0.85rem;
      border-radius: 4px;
      font-family: var(--display-font);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 0 12px rgba(0, 255, 115, 0.15);
    }

    .btn-submit:hover {
      background: var(--neon-green);
      color: #03080e;
      box-shadow: 0 0 25px rgba(0, 255, 115, 0.6);
      transform: translateY(-2px);
    }

    /* Right Operative List Header */
    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px dashed var(--panel-border);
      padding-bottom: 0.9rem;
    }

    .count-tag {
      background: rgba(0, 255, 115, 0.12);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 2px;
      letter-spacing: 0.06em;
    }

    .search-input {
      width: 250px;
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
    }

    /* Dynamic Operative Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.4rem;
    }

    .operative-card {
      background: rgba(3, 8, 15, 0.95);
      border: 1px solid #142a22;
      border-radius: 6px;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .operative-card:hover {
      border-color: var(--neon-green);
      box-shadow: 0 6px 25px rgba(0, 255, 115, 0.2);
      transform: translateY(-3px);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    .avatar-icon {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(0, 255, 115, 0.1) 0%, rgba(0, 229, 255, 0.1) 100%);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display-font);
      font-size: 1.1rem;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(0, 255, 115, 0.2);
    }

    .card-meta h3 {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .role-badge {
      display: inline-block;
      font-size: 0.68rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.15rem;
    }

    .card-intel {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      padding: 0.8rem;
      margin-bottom: 1rem;
    }

    .card-intel p {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
      word-break: break-all;
    }

    .card-intel p strong {
      color: var(--text-main);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #142a22;
      padding-top: 0.75rem;
    }

    .card-status {
      font-size: 0.7rem;
      color: var(--neon-green);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-terminate {
      background: transparent;
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      padding: 0.3rem 0.65rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-terminate:hover {
      background: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-style: italic;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Navigation / System Bar -->
  <header class="app-header">
    <div class="container header-bar">
      <div class="brand-title">
        <span>CYBER_OPS</span> // REGISTRY
      </div>
      <div class="header-status">
        <div class="sys-pill">
          <span class="blinking-dot"></span> SEC_NET: ENCRYPTED
        </div>
      </div>
    </div>
  </header>

  <!-- Main System Layout -->
  <main class="container main-layout">
    
    <!-- Operative Registration Terminal -->
    <aside class="cyber-panel">
      <h2 class="panel-heading">
        <span>[+]</span> DEPLOY OPERATIVE
      </h2>

      <form id="contactForm">
        <div class="form-group">
          <label for="contactName">Agent Codename / Name *</label>
          <input type="text" id="contactName" placeholder="e.g. Kameshwar S" required />
        </div>

        <div class="form-group">
          <label for="contactEmail">Encrypted Comms / Email *</label>
          <input type="email" id="contactEmail" placeholder="e.g. kameshwar@sec-ops.io" required />
        </div>

        <div class="form-group">
          <label for="contactPhone">Direct Frequency / Phone *</label>
          <input type="tel" id="contactPhone" placeholder="e.g. +91 98765 43210" required />
        </div>

        <div class="form-group">
          <label for="contactRole">Specialization / Role *</label>
          <select id="contactRole">
            <option value="Lead Red Team Operator">Lead Red Team Operator</option>
            <option value="Offensive Security Specialist">Offensive Security Specialist</option>
            <option value="Penetration Tester / Bug Bounty">Penetration Tester / Bug Bounty</option>
            <option value="SOC Incident Responder">SOC Incident Responder</option>
            <option value="Cryptanalyst & Reverse Engineer">Cryptanalyst & Reverse Engineer</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">
          Initialize Operative
        </button>
      </form>
    </aside>

    <!-- Active Operatives Grid -->
    <section class="cyber-panel">
      <div class="list-toolbar">
        <div>
          <h2 class="panel-heading" style="margin-bottom: 0; padding-bottom: 0; border: none;">
            <span>//</span> ACTIVE AGENTS
          </h2>
          <span id="contactCountBadge" class="count-tag" style="margin-top: 0.35rem; display: inline-block;">0 DEPLOYED</span>
        </div>

        <input type="text" id="searchInput" placeholder="Filter agents by role/name..." class="search-input" />
      </div>

      <div id="userListContainer" class="cards-grid">
        <!-- Dynamically populated cards -->
      </div>

      <div id="emptyState" class="empty-state hidden">
        [NO MATCHING OPERATIVES IDENTIFIED IN DATABASE]
      </div>
    </section>

  </main>

  <script>
    // Initial Cyber Operative Data pre-loaded with Kameshwar S
    let contacts = [
      {
        id: "sec-01",
        name: "Kameshwar S",
        email: "kameshwar@sec-ops.io",
        phone: "+91 98765 43210",
        role: "Lead Red Team Operator"
      },
      {
        id: "sec-02",
        name: "Cipher Zero",
        email: "zero@proxy-net.org",
        phone: "+1 415-555-0199",
        role: "Penetration Tester / Bug Bounty"
      }
    ];

    const contactForm = document.getElementById("contactForm");
    const contactName = document.getElementById("contactName");
    const contactEmail = document.getElementById("contactEmail");
    const contactPhone = document.getElementById("contactPhone");
    const contactRole = document.getElementById("contactRole");
    const userListContainer = document.getElementById("userListContainer");
    const contactCountBadge = document.getElementById("contactCountBadge");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");

    function renderUserList(filterTerm = "") {
      userListContainer.innerHTML = "";

      const filtered = contacts.filter((c) =>
        c.name.toLowerCase().includes(filterTerm.toLowerCase()) ||
        c.email.toLowerCase().includes(filterTerm.toLowerCase()) ||
        c.role.toLowerCase().includes(filterTerm.toLowerCase())
      );

      contactCountBadge.textContent = `${filtered.length} DEPLOYED`;

      if (filtered.length === 0) {
        emptyState.classList.remove("hidden");
        return;
      }
      emptyState.classList.add("hidden");

      filtered.forEach((contact) => {
        const card = document.createElement("article");
        card.className = "operative-card";

        const initials = contact.name.trim().split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase() || "OP";

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="avatar-icon">${initials}</div>
              <div class="card-meta">
                <h3>${escapeHTML(contact.name)}</h3>
                <span class="role-badge">${escapeHTML(contact.role)}</span>
              </div>
            </div>

            <div class="card-intel">
              <p><strong>COMMS:</strong> ${escapeHTML(contact.email)}</p>
              <p><strong>FREQ:</strong> ${escapeHTML(contact.phone)}</p>
            </div>
          </div>

          <div class="card-footer">
            <span class="card-status"><span class="blinking-dot"></span> ACTIVE</span>
            <button class="btn-terminate" onclick="terminateContact('${contact.id}')">Revoke</button>
          </div>
        `;

        userListContainer.appendChild(card);
      });
    }

    // Add Operative Handler
    contactForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const newAgent = {
        id: "agent-" + Date.now(),
        name: contactName.value.trim(),
        email: contactEmail.value.trim(),
        phone: contactPhone.value.trim(),
        role: contactRole.value
      };

      contacts.unshift(newAgent);
      contactForm.reset();
      renderUserList(searchInput.value);
    });

    // Revoke Operative Handler
    window.terminateContact = function(id) {
      contacts = contacts.filter((item) => item.id !== id);
      renderUserList(searchInput.value);
    };

    // Live search filter
    searchInput.addEventListener("input", (e) => {
      renderUserList(e.target.value);
    });

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Run initial render
    renderUserList();
  </script>
</body>
</html>
